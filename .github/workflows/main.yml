name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Persistent Debug Keystore
        run: |
          mkdir -p ~/.android
          cp -f fixed-debug.keystore ~/.android/debug.keystore
          cp -f fixed-debug.keystore app/fixed-debug.keystore

      - name: Auto Increment Version Code and Name
        run: |
          NEW_CODE=$((1000 + ${{ github.run_number }}))
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/g" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.0.${{ github.run_number }}"/g' app/build.gradle.kts

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: MyCloud v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
