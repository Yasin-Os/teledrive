name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Persistent Debug Keystore (যাতে আজীবন একই সিগনেচার থাকে)
        run: |
          mkdir -p ~/.android
          if [ ! -f "fixed-debug.keystore" ]; then
            keytool -genkeypair -v -keystore fixed-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main
            git add fixed-debug.keystore
            git commit -m "chore: add persistent debug keystore [skip ci]"
            git push origin HEAD:main
          fi
          cp -f fixed-debug.keystore ~/.android/debug.keystore

      - name: Auto Increment Version Code & Name
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.0.${{ github.run_number }}"/g' app/build.gradle.kts

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: MyCloud v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*universal*.apk
